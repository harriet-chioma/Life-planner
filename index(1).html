<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7d3f60">
  <meta name="description" content="Plan your 2027 goals, track weekly steps, journal, mood, and money.">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Life Planner 2027</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Quicksand:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="./styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <header>
    <div class="head-inner">
      <h1>Life Planner 2027</h1>
      <nav class="tabs" role="tablist" aria-label="Main sections">
        <button class="tab" role="tab" data-action="tab" data-tab="plan" aria-selected="false">Plan</button>
        <button class="tab" role="tab" data-action="tab" data-tab="today" aria-selected="false">Today</button>
        <button class="tab" role="tab" data-action="tab" data-tab="months" aria-selected="false">Months</button>
        <button class="tab" role="tab" data-action="tab" data-tab="journal" aria-selected="false">Journal</button>
        <button class="tab" role="tab" data-action="tab" data-tab="money" aria-selected="false">Money</button>
      </nav>
    </div>
  </header>

  <main id="app" tabindex="-1" aria-live="polite"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./app.js" defer></script>
</body>
</html>
